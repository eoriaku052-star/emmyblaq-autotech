<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EmmyBlaQ AutoTech | Automotive Electrical Tips & Services</title>

  <meta name="description" content="EmmyBlaQ AutoTech shares practical automotive electrical, car air conditioning, vehicle tracker and car diagnostic information.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#101827">

  <style>
    :root {
      --dark: #101827;
      --blue: #1677ff;
      --yellow: #ffc928;
      --light: #f3f6fb;
      --text: #263244;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      color: var(--blue);
      text-decoration: none;
    }

    header {
      background: var(--dark);
      color: var(--white);
      padding: 18px 6%;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: var(--yellow);
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    nav a {
      color: var(--white);
      font-size: 14px;
    }

    nav a:hover {
      color: var(--yellow);
    }

    .hero {
      background: linear-gradient(135deg, #101827, #183c68);
      color: var(--white);
      padding: 75px 6%;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(30px, 6vw, 48px);
      line-height: 1.2;
      margin-bottom: 20px;
    }

    .hero p {
      max-width: 700px;
      margin: 0 auto 25px;
      color: #e0e9f7;
    }

    .button {
      display: inline-block;
      background: var(--yellow);
      color: var(--dark);
      padding: 12px 22px;
      border-radius: 6px;
      font-weight: bold;
      margin: 5px;
    }

    .button.secondary {
      background: transparent;
      color: var(--white);
      border: 1px solid var(--white);
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
    }

    section {
      padding: 55px 0;
      scroll-margin-top: 20px;
    }

    .section-title {
      text-align: center;
      font-size: 29px;
      color: var(--dark);
      margin-bottom: 12px;
    }

    .section-intro {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--white);
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
    }

    .card h3 {
      color: var(--dark);
      margin-bottom: 10px;
    }

    .card p {
      margin-bottom: 12px;
    }

    .dark-section {
      background: #e7edf6;
    }

    .content-box {
      background: var(--white);
      padding: 25px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .
